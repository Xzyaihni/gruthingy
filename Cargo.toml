[package]
name = "gruthingy"
version = "0.1.0"
edition = "2024"

[dependencies]
# serde_json = "1.0"
# bincode = "1.3.3"
# arrayfire = { version = "3.8.0", features = ["afserde"] }
fastrand = "2.5"
nalgebra = { version = "0.35", features = [] }
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode_reader = "1.0"
oxiblas-blas = "0.2"
oxiblas-matrix = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"

[profile.release-perf]
inherits = "release"
strip = false
debug = true

[features]
timedebug = []
