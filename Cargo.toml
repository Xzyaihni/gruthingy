[package]
name = "gruthingy"
version = "0.1.0"
edition = "2024"

[dependencies]
fastrand = "2.5"
nalgebra = { version = "0.35", features = [] }
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode_reader = "1.0"
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = "1.25.2"

[dev-dependencies]
env_logger = "0.11.11"

[profile.debug-optimized]
inherits = "dev"
opt-level = 3

[profile.release]
panic = "abort"

[profile.release-perf]
inherits = "release"
strip = false
debug = true

[features]
concurrentbatches = []
renderdocapi = []
timedebug = []
nocoloring = []
dumpmemory = []
printcalculations = []
printinputsoutputs = []
